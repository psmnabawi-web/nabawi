name: ROP Gudang (cek Firebase)

# Cek SAJA (read-only) kondisi project sssg-dashboard-2026 sebelum ROP Gudang memakai database bersama
# (disetujui pemilik, 20/11/2026): database Firestore yang ada, rules aktif (ringkasan path saja), Realtime Database,
# web app, billing. Tidak mengubah apa pun. Output ringkas karena log Actions repo publik.
on:
  workflow_dispatch:
  push:
    branches: ["claude/zealous-carson-bns1ge"]
    paths:
      - ".github/workflows/rop-gudang-firebase-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT: sssg-dashboard-2026
      FIREBASE_TOKEN: ${{ secrets.SSSG_FIREBASE_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: firebase-tools (read-only)
        run: |
          FB="npx -y firebase-tools@latest"
          echo "== Firestore databases"; $FB firestore:databases:list --project "$PROJECT" || true
          echo "== Realtime Database"; $FB database:instances:list --project "$PROJECT" || true
          echo "== Web apps"; $FB apps:list WEB --project "$PROJECT" || true
      - name: Rules aktif (ringkasan) & billing
        run: |
          node --input-type=module -e '
          const P = process.env.PROJECT;
          // token akses dari refresh token "firebase login:ci" (client OAuth publik firebase-tools)
          const tok = await fetch("https://oauth2.googleapis.com/token", { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams({ grant_type: "refresh_token", refresh_token: process.env.FIREBASE_TOKEN,
              client_id: "563584335869-fgrhgmd47bqnekij5i8b5pr03ho849e6.apps.googleusercontent.com", client_secret: "j9iVZfS8kkCEFUPaAeJV0sAi" }) }).then((r) => r.json());
          if (!tok.access_token) { console.log("token gagal:", tok.error || "?"); process.exit(0); }
          const H = { authorization: "Bearer " + tok.access_token };
          const get = async (u) => { const r = await fetch(u, { headers: H }); let j = null; try { j = await r.json(); } catch {} return { status: r.status, j }; };
          const out = { rules: [] };
          const rel = await get(`https://firebaserules.googleapis.com/v1/projects/${P}/releases`);
          if (rel.status !== 200) out.rules = { status: rel.status };
          for (const x of (rel.j && rel.j.releases) || []) {
            const item = { release: x.name.split("/releases/")[1], updated: x.updateTime };
            const rs = await get(`https://firebaserules.googleapis.com/v1/${x.rulesetName}`);
            const src = rs.j && rs.j.source && rs.j.source.files ? rs.j.source.files.map((f) => f.content).join("\n") : "";
            item.lines = src.split("\n").length;
            item.matchPaths = (src.match(/match\s+\/[^\s{]+/g) || []).slice(0, 40);
            item.openUntilDate = /request\.time\s*<\s*timestamp\.date/.test(src);
            out.rules.push(item);
          }
          const bill = await get(`https://cloudbilling.googleapis.com/v1/projects/${P}/billingInfo`);
          out.billingEnabled = bill.status === 200 ? !!bill.j.billingEnabled : { status: bill.status };
          console.log(JSON.stringify(out, null, 1));
          '
