name: WA Blast Pencapaian

# Jadwal kirim: 09.00 dan 14.00 WIB (UTC+7, tanpa DST). Cron GitHub di repo ini terbukti telat 10 menit sampai beberapa jam dan sering
# dilewati, jadi tiap sesi diberi banyak slot di dalam jendela kirim (pagi 08.50-11.59, siang 13.50-16.59 WIB; menit ganjil agar tidak
# bertabrakan dengan antrean :00). Semua run terjadwal memakai mode auto: hanya run pertama yang berhasil mengirim; run berikutnya pada
# sesi yang sama selesai dalam hitungan detik tanpa mengirim (scripts/wa-dedupe.mjs, penanda artifact sent-<tanggal>-<sesi>).
# Pemicu luar yang tepat waktu (cron-job.org → workflow_dispatch action=auto, lihat README) memakai pengaman yang sama.
# PENTING: GitHub hanya menjalankan "schedule" dari file workflow di BRANCH DEFAULT repo, dan menonaktifkan
# jadwal otomatis bila repo publik tidak menerima commit selama 60 hari (aktifkan lagi di tab Actions).
on:
  schedule:
    - cron: "53 1 * * *"          # 08.53 WIB
    - cron: "7,23,41 2,3,4 * * *" # 09.07 … 11.41 WIB
    - cron: "53 6 * * *"          # 13.53 WIB
    - cron: "7,23,41 7,8,9 * * *" # 14.07 … 16.41 WIB
  # Setiap perubahan pada script/workflow ini diuji otomatis dalam mode dry_run (tidak mengirim apa pun).
  push:
    branches: ["claude/adoring-dijkstra-78ese7", "main"]
    paths: [".github/workflows/wa-blast.yml", "apps/sssg-dashboard/scripts/wa-blast.mjs", "apps/sssg-dashboard/scripts/wa-dedupe.mjs", "apps/sssg-dashboard/package.json"]
  workflow_dispatch:
    inputs:
      action:
        description: "auto = kirim bila sesi (pagi/siang) hari ini belum terkirim dan masih dalam jendela · send = kirim sekarang (tanpa cek) · dry_run = susun pesan saja (lihat artifact) · list_groups = tulis ID grup ke artifact (Fonnte)"
        type: choice
        default: dry_run
        options: [dry_run, auto, send, list_groups]
      only:
        description: "Opsional: kirim hanya ke tujuan ini, pisahkan koma (BOD, Grup Leader, atau nama di WA_TARGET_PRIBADI mis. Mami)"
        type: string
        default: ""

concurrency:
  group: wa-blast
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # push → selalu dry_run; dispatch → sesuai pilihan; schedule → auto (kirim bila sesi belum terkirim & dalam jendela)
      ACTION: ${{ github.event_name == 'push' && 'dry_run' || inputs.action || 'auto' }}
      # auto = run terjadwal ATAU dispatch dengan action=auto: boleh dilewati oleh pengaman satu-kiriman-per-sesi
      WA_AUTO: ${{ (github.event_name == 'schedule' || inputs.action == 'auto') && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cek sesi hari ini sudah terkirim? (hanya mode auto/jadwal yang bisa dilewati)
        id: dedupe
        working-directory: apps/sssg-dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WA_AUTO: ${{ env.WA_AUTO }}
        run: node scripts/wa-dedupe.mjs
      - name: Pasang Playwright (Chromium)
        if: ${{ steps.dedupe.outputs.skip != 'true' && env.ACTION != 'list_groups' }}
        working-directory: apps/sssg-dashboard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Susun & kirim pesan
        id: send
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        working-directory: apps/sssg-dashboard
        env:
          SSSG_URL: https://dashboard-inti-warna.web.app/#exec
          # WA_GATEWAY dan WA_API_URL bukan rahasia; simpan sebagai Variables agar tidak ikut disamarkan di log.
          WA_GATEWAY: ${{ vars.WA_GATEWAY || secrets.WA_GATEWAY }}
          WA_API_URL: ${{ secrets.WA_API_URL || vars.WA_API_URL }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_TARGET_BOD: ${{ secrets.WA_TARGET_BOD }}
          WA_TARGET_LEADER: ${{ secrets.WA_TARGET_LEADER }}
          WA_TARGET_PRIBADI: ${{ secrets.WA_TARGET_PRIBADI }}
          WA_ONLY: ${{ inputs.only || '' }}
          WA_MODE_BOD: ${{ vars.WA_MODE_BOD || 'detail' }}
          WA_MODE_LEADER: ${{ vars.WA_MODE_LEADER || 'pct' }}
          WA_LEADER_ALLOW_RUPIAH: ${{ vars.WA_LEADER_ALLOW_RUPIAH || '' }}
          OUT_DIR: wa-out
        run: node scripts/wa-blast.mjs
      # Salinan pesan/daftar grup hanya disimpan untuk uji (dry_run, push, list_groups), bukan untuk kiriman terjadwal:
      # repo ini publik, artifact bisa diunduh siapa pun yang login GitHub. Hapus artifact setelah dibaca.
      # always(): bila satu grup terkirim dan grup lain gagal, step di atas merah tetapi penanda tetap diunggah (script hanya menulis
      # sent-marker.txt bila ada yang terkirim), supaya run cadangan tidak mengirim ulang ke grup yang sudah menerima.
      - name: Tandai sesi ini sudah terkirim (penanda untuk run cadangan)
        if: ${{ always() && (env.ACTION == 'send' || env.ACTION == 'auto') && steps.dedupe.outputs.skip != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: sent-${{ steps.dedupe.outputs.slot }}
          path: apps/sssg-dashboard/wa-out/sent-marker.txt
          if-no-files-found: ignore
          retention-days: 2
      - name: Simpan salinan (hanya mode uji)
        if: ${{ always() && env.ACTION != 'send' && env.ACTION != 'auto' }}
        uses: actions/upload-artifact@v4
        with:
          name: pesan-wa-${{ github.run_number }}
          path: apps/sssg-dashboard/wa-out/
          if-no-files-found: ignore
          retention-days: 3
