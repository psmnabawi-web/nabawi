name: WA Blast Pencapaian

# Jadwal dalam UTC (WIB = UTC+7, tanpa DST): 02:03 UTC = 09:03 WIB, 07:03 UTC = 14:03 WIB.
# GitHub sering menunda atau melewatkan slot jadwal (terutama 02:xx UTC), karena itu ada slot cadangan :33 dan
# pengaman anti-kirim-ganda (scripts/wa-dedupe.mjs): slot berikutnya dilewati bila sudah ada kiriman dalam 150 menit.
# Untuk jam yang presisi, picu dari luar lewat workflow_dispatch (lihat README: cron-job.org).
# PENTING: GitHub hanya menjalankan "schedule" dari file workflow di BRANCH DEFAULT repo, dan menonaktifkan
# jadwal otomatis bila repo publik tidak menerima commit selama 60 hari (aktifkan lagi di tab Actions).
on:
  schedule:
    - cron: "3 2,7 * * *"
    - cron: "33 2,7 * * *"
  # Setiap perubahan pada script/workflow ini diuji otomatis dalam mode dry_run (tidak mengirim apa pun).
  push:
    branches: ["claude/adoring-dijkstra-78ese7", "main"]
    paths: [".github/workflows/wa-blast.yml", "apps/sssg-dashboard/scripts/wa-blast.mjs", "apps/sssg-dashboard/scripts/wa-dedupe.mjs", "apps/sssg-dashboard/package.json"]
  workflow_dispatch:
    inputs:
      action:
        description: "send = kirim ke grup · dry_run = susun pesan saja (lihat artifact) · list_groups = tulis ID grup ke artifact (Fonnte)"
        type: choice
        default: dry_run
        options: [dry_run, send, list_groups]

concurrency:
  group: wa-blast
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # push → selalu dry_run; dispatch → sesuai pilihan; schedule → send
      ACTION: ${{ github.event_name == 'push' && 'dry_run' || inputs.action || 'send' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pasang Playwright (Chromium)
        if: ${{ env.ACTION != 'list_groups' }}
        working-directory: apps/sssg-dashboard
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Cek kiriman ganda (hanya jadwal)
        id: dedupe
        if: ${{ github.event_name == 'schedule' }}
        working-directory: apps/sssg-dashboard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/wa-dedupe.mjs
      - name: Susun & kirim pesan
        id: send
        if: ${{ steps.dedupe.outputs.skip != 'true' }}
        working-directory: apps/sssg-dashboard
        env:
          SSSG_URL: https://dashboard-inti-warna.web.app/#exec
          # WA_GATEWAY dan WA_API_URL bukan rahasia; simpan sebagai Variables agar tidak ikut disamarkan di log.
          WA_GATEWAY: ${{ vars.WA_GATEWAY || secrets.WA_GATEWAY }}
          WA_API_URL: ${{ secrets.WA_API_URL || vars.WA_API_URL }}
          WA_TOKEN: ${{ secrets.WA_TOKEN }}
          WA_TARGET_BOD: ${{ secrets.WA_TARGET_BOD }}
          WA_TARGET_LEADER: ${{ secrets.WA_TARGET_LEADER }}
          WA_MODE_BOD: ${{ vars.WA_MODE_BOD || 'detail' }}
          WA_MODE_LEADER: ${{ vars.WA_MODE_LEADER || 'pct' }}
          WA_LEADER_ALLOW_RUPIAH: ${{ vars.WA_LEADER_ALLOW_RUPIAH || '' }}
          OUT_DIR: wa-out
        run: node scripts/wa-blast.mjs
      # Salinan pesan/daftar grup hanya disimpan untuk uji (dry_run, push, list_groups), bukan untuk kiriman terjadwal:
      # repo ini publik, artifact bisa diunduh siapa pun yang login GitHub. Hapus artifact setelah dibaca.
      - name: Tandai run ini sudah mengirim (untuk pengaman anti-ganda)
        if: ${{ env.ACTION == 'send' && steps.send.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: sent-${{ github.run_id }}
          path: apps/sssg-dashboard/wa-out/sent-marker.txt
          if-no-files-found: ignore
          retention-days: 2
      - name: Simpan salinan (hanya mode uji)
        if: ${{ always() && env.ACTION != 'send' }}
        uses: actions/upload-artifact@v4
        with:
          name: pesan-wa-${{ github.run_number }}
          path: apps/sssg-dashboard/wa-out/
          if-no-files-found: ignore
          retention-days: 3
