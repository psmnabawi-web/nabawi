name: App Filter Oil (situs utama)

# Mengelola situs UTAMA app Trecking Filter Oil (trecking-filter-oil-store.web.app). Disetujui pemilik app (psmnabawi@gmail.com).
#   snapshot → salin versi live (semua file + konfigurasi hosting) ke apps/filter-oil-app/live dan commit ke branch ini
#   deploy   → terbitkan versi live yang sama persis + tambahan dari apps/filter-oil-app/overlay (menu Kepatuhan & Export)
#   rollback → kembalikan versi sebelumnya (isi "version", atau kosongkan untuk versi terakhir sebelum deploy kepatuhan)
# Hanya dijalankan manual (Run workflow). Login tanpa key lewat Workload Identity (kepatuhan-deployer, Firebase Hosting Admin).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "snapshot | deploy | rollback"
        type: choice
        default: snapshot
        options: [snapshot, deploy, rollback]
      version:
        description: "Khusus rollback: nama versi (sites/.../versions/xxx atau xxx). Kosong = versi sebelum deploy kepatuhan"
        required: false
        default: ""
  # Push hanya menjalankan tes script (tidak menyentuh situs).
  push:
    branches: ["claude/ecstatic-franklin-hhjvmk", "claude/adoring-dijkstra-78ese7", "main"]
    paths: ["apps/filter-oil-app/scripts/**", "apps/filter-oil-app/test/**", ".github/workflows/filter-oil-app-hosting.yml"]

concurrency:
  group: filter-oil-app-hosting
  cancel-in-progress: false

permissions:
  contents: write   # snapshot di-commit ke branch ini
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACTION: ${{ github.event_name == 'push' && 'test' || inputs.action }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tes script (API tiruan)
        working-directory: apps/filter-oil-app
        run: npm test
      - name: Login Google (Workload Identity, tanpa key)
        id: auth
        if: ${{ env.ACTION != 'test' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: trecking-filter-oil-store
          workload_identity_provider: projects/696588727829/locations/global/workloadIdentityPools/github-actions/providers/nabawi-repo
          service_account: kepatuhan-deployer@trecking-filter-oil-store.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform
          create_credentials_file: false
          export_environment_variables: false
      - name: Jalankan ${{ env.ACTION }}
        if: ${{ env.ACTION != 'test' }}
        working-directory: apps/filter-oil-app
        env:
          FO_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          ROLLBACK_VERSION: ${{ inputs.version }}
        run: node scripts/hosting.mjs "$ACTION"
      - name: Commit snapshot
        if: ${{ env.ACTION == 'snapshot' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/filter-oil-app/live
          if git diff --cached --quiet; then echo "Snapshot tidak berubah."; exit 0; fi
          git commit -m "Filter Oil app: snapshot versi live dari Firebase Hosting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
