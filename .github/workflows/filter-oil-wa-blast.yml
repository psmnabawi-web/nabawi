name: WA Blast Scoring Filter Oil

# Khusus app Trecking Filter Oil Store (Firebase project trecking-filter-oil-store). Tidak terkait SSSG/Almaz.
# Jadwal dalam UTC (WIB = UTC+7, tanpa DST): 05:02 = 12.02 WIB, 11:02 = 18.02 WIB, 17:02 = 00.02 WIB.
# Menit :02 dipakai karena slot :00 paling padat di GitHub dan paling sering tertunda.
# Kiriman 00.02 WIB otomatis berisi REKAP FINAL hari sebelumnya (bukan 0% untuk hari yang baru dimulai).
# PENTING: GitHub hanya menjalankan "schedule" dan tombol "Run workflow" dari file workflow di BRANCH DEFAULT repo,
# dan menonaktifkan jadwal bila repo publik tidak menerima commit selama 60 hari (aktifkan lagi di tab Actions).
on:
  schedule:
    - cron: "2 5,11,17 * * *"
  # Setiap perubahan pada script/workflow ini diuji otomatis: tes server tiruan + dry_run ke data asli (tidak mengirim apa pun).
  push:
    branches: ["claude/ecstatic-franklin-hhjvmk", "claude/adoring-dijkstra-78ese7", "main"]
    paths: [".github/workflows/filter-oil-wa-blast.yml", "apps/filter-oil-wa/**"]
  workflow_dispatch:
    inputs:
      action:
        description: "dry_run = susun pesan saja (lihat artifact) · send = kirim ke grup · discover = struktur data · list_groups = daftar grup Fonnte"
        type: choice
        default: dry_run
        options: [dry_run, send, discover, list_groups]
      report_date:
        description: "Opsional: tanggal laporan YYYY-MM-DD (kosongkan = otomatis)"
        required: false
        default: ""

concurrency:
  group: filter-oil-wa-blast
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # login ke Google Cloud lewat Workload Identity Federation (tanpa key/secret)

jobs:
  blast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # push → selalu dry_run; dispatch → sesuai pilihan; schedule → send (tetap tunduk pada status AKTIF/UJI/MATI di Sheet)
      ACTION: ${{ github.event_name == 'push' && 'dry_run' || inputs.action || 'send' }}
      HAS_SA_KEY: ${{ secrets.FO_FIREBASE_SA != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Uji otomatis (server tiruan, tanpa data asli)
        if: ${{ github.event_name == 'push' }}
        working-directory: apps/filter-oil-wa
        run: npm test
      # Login tanpa key: GitHub OIDC → Workload Identity Pool di project trecking-filter-oil-store → service account read-only.
      # Disiapkan sekali lewat blok Cloud Shell di apps/filter-oil-wa/README.md. Saat push (uji) boleh gagal; script memberi peringatan.
      - name: Login Google (Workload Identity, tanpa key)
        id: auth
        if: ${{ env.HAS_SA_KEY != 'true' }}
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: google-github-actions/auth@v2
        with:
          project_id: trecking-filter-oil-store
          workload_identity_provider: projects/696588727829/locations/global/workloadIdentityPools/github-actions/providers/nabawi-repo
          service_account: wa-blast-reader@trecking-filter-oil-store.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/datastore,https://www.googleapis.com/auth/spreadsheets
          create_credentials_file: false
          export_environment_variables: false
      - name: Susun & kirim laporan
        working-directory: apps/filter-oil-wa
        env:
          # Akses Google: token dari langkah login di atas, atau (alternatif) key service account di secret FO_FIREBASE_SA.
          FO_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          FO_SA_KEY: ${{ secrets.FO_FIREBASE_SA }}
          FO_PROJECT_ID: trecking-filter-oil-store
          # Google Sheet pengaturan milik psmnabawi@gmail.com (status AKTIF/UJI/MATI, token Fonnte, grup tujuan, tab Riwayat).
          # Hanya pemilik dan service account yang punya akses; ID ini sendiri tidak membuka isinya.
          FO_CONFIG_SHEET_ID: ${{ vars.FO_CONFIG_SHEET_ID || '1zsimrNGIzQvrTBFtjEO_Yox3o7uJehHQGLG8OAvc3LU' }}
          FO_RUN_LABEL: ${{ github.event_name }}
          # Struktur data app Filter Oil. Kosong = deteksi otomatis; isi lewat Settings → Variables bila perlu.
          FO_STORE_COLLECTION: ${{ vars.FO_STORE_COLLECTION }}
          FO_STORE_NAME_FIELD: ${{ vars.FO_STORE_NAME_FIELD }}
          FO_STORE_ACTIVE_FIELD: ${{ vars.FO_STORE_ACTIVE_FIELD }}
          FO_STORE_LIST: ${{ vars.FO_STORE_LIST }}
          # Struktur app Filter Oil (terbaca 05/10/2026): data scoring = koleksi filterRecords (storeId, dateKey "YYYY-MM-DD",
          # slotId, complianceScore); master store = koleksi stores (name, active, activeFrom). oilChanges = ganti minyak, bukan scoring.
          FO_SCORE_COLLECTION: ${{ vars.FO_SCORE_COLLECTION || 'filterRecords' }}
          FO_SCORE_STORE_FIELD: ${{ vars.FO_SCORE_STORE_FIELD || 'storeId' }}
          FO_SCORE_DATE_FIELD: ${{ vars.FO_SCORE_DATE_FIELD || 'dateKey' }}
          FO_SCORE_SLOT_FIELD: ${{ vars.FO_SCORE_SLOT_FIELD || 'slotId' }}
          FO_SCORE_DATE_FORMAT: ${{ vars.FO_SCORE_DATE_FORMAT }}
          FO_TITLE: ${{ vars.FO_TITLE }}
          REPORT_DATE: ${{ inputs.report_date }}
          # Gateway WhatsApp: token & grup diambil dari Sheet pengaturan. Secret FO_WA_TOKEN/FO_WA_TARGET (bila diisi) menang;
          # bila FO_WA_TOKEN kosong, secret WA_TOKEN yang sudah ada di repo ini ikut dibaca (tidak diubah).
          WA_GATEWAY: ${{ secrets.FO_WA_TOKEN != '' && (vars.FO_WA_GATEWAY || 'fonnte') || (vars.WA_GATEWAY || secrets.WA_GATEWAY || 'fonnte') }}
          WA_TOKEN: ${{ secrets.FO_WA_TOKEN || secrets.WA_TOKEN }}
          WA_API_URL: ${{ vars.FO_WA_API_URL || secrets.WA_API_URL || vars.WA_API_URL }}
          # Nama grup persis seperti di WhatsApp (Fonnte) atau ID grup 1203…@g.us; beberapa tujuan pisahkan dengan koma.
          WA_TARGET: ${{ secrets.FO_WA_TARGET }}
          OUT_DIR: wa-out
        run: node scripts/wa-blast.mjs
      # Salinan pesan/daftar grup hanya untuk uji manual (Run workflow → dry_run / list_groups), bukan untuk push atau kiriman
      # terjadwal: repo ini publik, artifact bisa diunduh siapa pun yang login GitHub. Hapus artifact setelah dibaca.
      - name: Simpan salinan (hanya uji manual)
        if: ${{ always() && github.event_name == 'workflow_dispatch' && env.ACTION != 'send' }}
        uses: actions/upload-artifact@v4
        with:
          name: filter-oil-wa-${{ github.run_number }}
          path: apps/filter-oil-wa/wa-out/
          if-no-files-found: ignore
          retention-days: 3
