# Firebase App Hosting (Next.js). Secrets dibuat dengan:
#   firebase apphosting:secrets:set ANTHROPIC_API_KEY
#   firebase apphosting:secrets:set ADMIN_EMAILS
runConfig:
  minInstances: 0
  maxInstances: 4
  concurrency: 40
  cpu: 1
  memoryMiB: 1024
env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "GANTI_DENGAN_API_KEY"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "PROJECT_ID.firebaseapp.com"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "PROJECT_ID"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "PROJECT_ID.firebasestorage.app"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "000000000000"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:000000000000:web:xxxx"
    availability: [BUILD, RUNTIME]
  - variable: AI_MODEL
    value: "claude-opus-5"
    availability: [RUNTIME]
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability: [RUNTIME]
  - variable: ADMIN_EMAILS
    secret: ADMIN_EMAILS
    availability: [RUNTIME]
